#
# Local shift-left mirror of the Poka-Yoke gates.
# Developers run `pre-commit install` once; after that the same checks that
# block the pipeline run on every local commit, so violations are caught at
# the earliest possible moment.

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--check]
        files: ^(backend|data)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|data)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [detect, --config, security/gitleaks.toml, --redact]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
