# File      : .github/workflows/ci.yml
# Purpose   : Task 2 - the Poka-Yoke fail-closed build gate.
#
#             Design contract (every property is load-bearing):
#               1. FAIL CLOSED. Any gate failure fails the run; no later job
#                  executes; nothing can deploy. There is no continue-on-error
#                  anywhere in this file, and there never may be.
#               2. SEQUENTIAL DEPENDENCY CHAIN. Every quality job is wired
#                  with `needs`, so the deployment-readiness attestation at
#                  the end can only be produced when all ten gates passed.
#               3. LEAST PRIVILEGE. The workflow token receives
#                  contents: read - it cannot write anything.
#               4. DETERMINISTIC TOOLING. Every tool version is pinned in one
#                  place (env below), so a gate never changes behavior between
#                  runs.
#               5. QUARANTINE. A failing commit is quarantined: its checks are
#                  marked failed, artifacts of the failure are preserved for
#                  triage, and branch protection (documented in
#                  docs/demo_guide.md) makes merging impossible until every
#                  required gate is green again.
###############################################################################

name: Poka-Yoke Fail-Closed Build Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poka-yoke-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  TERRAFORM_VERSION: "1.9.8"
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_VERSION: "0.58.1"
  BLACK_VERSION: "25.1.0"
  RUFF_VERSION: "0.9.6"

jobs:
  # -------------------------------------------------------------------------
  # Gate 1 + 2 happen through checkout and pinned dependency installation.
  # -------------------------------------------------------------------------

  python_format_gate:
    name: "Gate 3 - Python Formatting (Black, check only)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned formatter
        run: python -m pip install --quiet "black==${BLACK_VERSION}"

      - name: Enforce formatting (no rewrites - check only)
        run: black --check --diff backend/ data/

  python_lint_gate:
    name: "Gate 4 - Python Linting (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned linter
        run: python -m pip install --quiet "ruff==${RUFF_VERSION}"

      - name: Enforce lint rules
        run: ruff check backend/ data/

  terraform_format_gate:
    name: "Gate 5 - Terraform Formatting (canonical)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Enforce canonical formatting
        run: terraform fmt -check -recursive -diff terraform/

  terraform_validate_gate:
    name: "Gate 6 - Terraform Validation"
    runs-on: ubuntu-latest
    needs: [terraform_format_gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize modules without backend or credentials
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate configuration against provider schemas
        working-directory: terraform
        run: terraform validate -no-color

  secret_scan_gate:
    name: "Gate 7 - Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for complete secret scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks across entire history (exit code 1 on any finding)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          mkdir -p poka-yoke-reports
          ./gitleaks detect \
            --source . \
            --config security/gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-path poka-yoke-reports/gitleaks-report.json \
            --verbose

      - name: Preserve scan report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: poka-yoke-reports/gitleaks-report.json
          if-no-files-found: ignore

  security_scan_gate:
    name: "Gate 8 - Vulnerability and Misconfiguration Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Trivy
        run: |
          set -e
          # install.sh hits GitHub API (rate-limited on anonymous runners) — use direct release download instead
          TRIVY_TGZ="trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          for i in 1 2 3; do
            echo "Attempt $i: installing Trivy v${TRIVY_VERSION} via direct download..."
            if curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_TGZ}" -o /tmp/trivy.tgz \
              && tar -xzf /tmp/trivy.tgz -C /tmp trivy \
              && sudo mv /tmp/trivy /usr/local/bin/trivy \
              && chmod +x /usr/local/bin/trivy; then
              break
            fi
            echo "Direct download failed, retrying in 10s..."
            sleep 10
            if [ "$i" -eq 3 ]; then
              echo "Trivy install failed after 3 attempts"
              exit 1
            fi
          done
          trivy --version

      - name: Scan filesystem for vulnerabilities, misconfigurations, and secrets
        run: |
          mkdir -p poka-yoke-reports
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --ignore-unfixed \
            --skip-dirs demo/violations \
            --exit-code 1 \
            --format table \
            --output poka-yoke-reports/trivy-report.txt

      - name: Preserve scan report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: poka-yoke-reports/trivy-report.txt
          if-no-files-found: ignore

  tests_gate:
    name: "Gate 9 - Deterministic Data Validation Tests"
    runs-on: ubuntu-latest
    needs: [python_format_gate, python_lint_gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned application dependencies
        working-directory: backend
        run: python -m pip install --quiet -r requirements.txt

      - name: Run the full Decision Yes/No validation test suite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          DJANGO_SECRET_KEY: poka-yoke-ephemeral-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: "True"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        run: python -m pytest onboarding/tests -q

  django_build_check_gate:
    name: "Gate 9b - Django Build Readiness Check"
    runs-on: ubuntu-latest
    needs: [tests_gate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned application dependencies
        working-directory: backend
        run: python -m pip install --quiet -r requirements.txt

      - name: Run deployment system checks (fail level ERROR)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: poka-yoke-ephemeral-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py makemigrations --check --dry-run

  quarantine_drill:
    name: "Poka-Yoke Drill - Prove The Detectors Still Fire"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks

      - name: Verify the leaked-secret fixture IS detected outside the allowlisted training range
        run: |
          mkdir -p /tmp/drill
          cp demo/violations/leaked_api_credentials.txt /tmp/drill/live_secret.txt
          set +e
          ./gitleaks detect \
            --source /tmp/drill \
            --no-git \
            --redact \
            --exit-code 1
          DRILL_EXIT=$?
          set -e
          if [ "$DRILL_EXIT" -eq 1 ]; then
            echo "Drill passed: the detector fired on a planted secret (exit code 1)."
          else
            echo "DRILL FAILED: the detector stayed silent on a planted secret."
            exit 1
          fi

      - name: Verify the formatting fixture violates Black
        run: |
          python -m pip install --quiet "black==${BLACK_VERSION}"
          set +e
          black --check demo/violations/bad_formatting_example.py
          BLACK_EXIT=$?
          set -e
          if [ "$BLACK_EXIT" -ne 0 ]; then
            echo "Drill passed: the formatter rejected malformed code (exit code ${BLACK_EXIT})."
          else
            echo "DRILL FAILED: the formatter accepted malformed code."
            exit 1
          fi

  deploy_readiness_attestation:
    name: "Gate 10 - Deployment Readiness Attestation"
    runs-on: ubuntu-latest
    needs:
      [
        python_format_gate,
        python_lint_gate,
        terraform_format_gate,
        terraform_validate_gate,
        secret_scan_gate,
        security_scan_gate,
        tests_gate,
        django_build_check_gate,
        quarantine_drill,
      ]
    steps:
      - name: Issue the promotion attestation
        run: |
          echo "============================================================"
          echo " POKA-YOKE ATTESTATION: ALL GATES GREEN"
          echo " Commit : ${{ github.sha }}"
          echo " Ref    : ${{ github.ref }}"
          echo " Every mandatory gate passed. This commit alone is"
          echo " eligible for promotion to staging by the delivery job,"
          echo " which runs only downstream of this attestation."
          echo "============================================================"

  quarantine_on_failure:
    name: "Quarantine - Capture Evidence On Failure"
    runs-on: ubuntu-latest
    if: failure()
    needs:
      [
        python_format_gate,
        python_lint_gate,
        terraform_format_gate,
        terraform_validate_gate,
        secret_scan_gate,
        security_scan_gate,
        tests_gate,
        django_build_check_gate,
        quarantine_drill,
      ]
    steps:
      - name: Quarantine notice
        run: |
          echo "============================================================"
          echo " QUARANTINE TRIGGERED"
          echo " Commit : ${{ github.sha }}"
          echo " At least one Poka-Yoke gate failed. Branch protection"
          echo " blocks merge, the attestation job never ran, and no"
          echo " deployment pathway was reached. Failed-gate evidence:"
          echo "${{ toJSON(needs) }}"
          echo "============================================================"
